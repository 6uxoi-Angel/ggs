[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/zapret",
    "crates/netmon",
    "crates/diag",
    "crates/bridge",
    "crates/remote",
    "crates/app",
]

[workspace.package]
version = "3.0.0-alpha.2"
edition = "2021"
rust-version = "1.82"
authors = ["6uxoi_Angel"]
repository = "https://github.com/6uxoi-Angel/Integra---zapret-gui"

[workspace.dependencies]
integra-core = { path = "crates/core" }
integra-zapret = { path = "crates/zapret" }
integra-netmon = { path = "crates/netmon" }
integra-diag = { path = "crates/diag" }
integra-bridge = { path = "crates/bridge" }
integra-remote = { path = "crates/remote" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
rand = "0.8"
subtle = "2"
idna = "1"
ipnet = "2"
encoding_rs = "0.8"
regex = "1"
tiny_http = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
windows = "0.61"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
